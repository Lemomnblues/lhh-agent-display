<!-- LHH用工合规助手大屏。模型及动画恢复自 https://github.com/cyberdaddyleo/agent-display ，版本 ff44824a741d9b2a767b82f39d3dd34c75c87e3f。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LHH用工合规助手大屏</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<style>
html, body { height: 100%; margin: 0; overflow: hidden; background: #03050c; color-scheme: dark; }
#host-nebula { position: relative; height: 100%; }
</style>
</head>
<body>
<main id="host-nebula" aria-label="LHH用工合规助手大屏"></main>
<template id="tpl-nebula">
<style>
/* Layout: 整屏是一片星云 —— 正中是 CHIEF 的丝带星核，四周 12 团彩色星云各代表一个智能体。
   每来一个新需求，星云蛛按工作流在相关智能体的星云之间一跳一跳地移动，伸触须逐字读词：普通词连线，模糊词标红、问 CHIEF、补成具体要求，评分随之上涨；
   审完跳回星核，沿跳过时拉出的丝线派单。镜头默认跟着星云蛛走。HUD：左上标题 + 当前章节，右上数据栏 + 流程标签，底部六个玻璃框体。深空单一深色。 */
:host{
  color-scheme:dark;
  --bg:#03050c; --ink:#eaf1ff; --ink2:#a7b5d2; --mute:#5f6d8a; --dim:#343e58;
  --hair:rgba(150,190,255,.13); --hair2:rgba(150,190,255,.26);
  --ice:#9fd4ff; --cyan:#62e3ff; --peach:#ffb48f; --pink:#ff6fae; --gold:#ffd27a; --good:#6ff0c0; --bad:#ff6b8b;
  --display:"Syncopate","Noto Sans SC",system-ui,sans-serif;
  --mono:"JetBrains Mono","Noto Sans SC","PingFang SC",ui-monospace,Menlo,monospace;
  --cjk:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
:host{display:block;height:100%;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--mono);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
.gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.gl.drag{cursor:grabbing}
.gl.hov{cursor:pointer}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 100% at 50% 45%,transparent 58%,rgba(1,2,6,.5) 86%,rgba(1,2,6,.8))}
.fit{position:absolute;inset:0;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.fit-in{position:relative;width:100%;height:100%}
.board{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--s,.5));pointer-events:none}
.pe{pointer-events:auto}

/* ---------- 3D 里的浮层：星云标签 / 词标签 / 星核状态 ---------- */
.ovl{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.cl{--c:#fff;position:absolute;left:0;top:0;white-space:nowrap;transform-origin:0 100%;opacity:var(--f,1);transition:opacity .5s}
.cl b{font:500 16px/1 var(--mono);color:var(--c);letter-spacing:.02em;text-shadow:0 0 12px var(--c),0 0 3px #000}
.cl i{font-style:normal;font-family:var(--cjk);font-size:11.5px;color:var(--ink2);margin-left:7px;text-shadow:0 0 4px #000}
.cl small{display:block;margin-top:4px;font:400 10px/1 var(--mono);color:var(--mute);letter-spacing:.04em;text-shadow:0 0 4px #000}
.cl.idle{opacity:calc(var(--f,1) * .5)}
.cl.queue small{color:var(--ink2)}
.cl.on small{color:var(--ink)}
.cl.on b{font-weight:700}
.cl.done small{color:var(--good)}
.wt{position:absolute;left:0;top:0;white-space:nowrap;font:500 10.5px/1 var(--mono);color:var(--ink);padding:3px 6px 4px;border:1px solid rgba(170,205,255,.5);background:rgba(4,8,20,.72);opacity:var(--f,1);transition:opacity .35s,background-color .3s,border-color .3s,color .3s}
.wt::before{content:"";position:absolute;left:50%;top:100%;width:1px;height:5px;background:inherit;border-left:1px solid rgba(170,205,255,.5)}
.wt.flag{background:var(--pink);border-color:var(--pink);color:#17040d;font-weight:700}
.wt.ask{background:rgba(255,111,174,.18);border-color:var(--pink);color:var(--pink)}
.wt.fix{border-color:var(--good);color:var(--good);background:rgba(3,22,18,.78)}
.wt.fix s{color:#8090ad;text-decoration-thickness:1px;margin-right:6px}
.wt.lnk{border-color:var(--cyan);color:var(--cyan)}
.chip{--c:#9fd4ff;position:absolute;left:0;top:0;white-space:nowrap;font:700 12.5px/1 var(--mono);color:#050811;background:var(--c);padding:5px 9px 6px;box-shadow:0 0 16px -2px var(--c),0 0 0 1px rgba(255,255,255,.35) inset;transform-origin:50% 50%;pointer-events:none;will-change:transform,opacity;opacity:0}
.chip i{font-style:normal;font-family:var(--cjk);font-weight:700;margin-left:6px}
.chip.big{color:#03140f;box-shadow:0 0 24px 0 var(--c),0 0 0 1px rgba(255,255,255,.5) inset}
.chip::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:14px;background:linear-gradient(var(--c),transparent)}
.core{position:absolute;left:0;top:0;white-space:nowrap;text-align:center;transform:translate(-50%,-100%)}
.core b{font:500 18px/1 var(--mono);color:#fff;text-shadow:0 0 12px #9fd4ff,0 0 3px #000;letter-spacing:.04em}
.core i{font-style:normal;font-family:var(--cjk);font-size:11.5px;color:var(--ink2);margin-left:7px}
.core small{display:block;margin-top:5px;font:500 10px/1 var(--mono);letter-spacing:.24em;color:var(--ice);text-shadow:0 0 6px #000}
.core small.ans{color:var(--gold);letter-spacing:.08em}
.core small.ship{color:var(--good);letter-spacing:.12em}

/* ---------- 作战大屏版式 ---------- */
.topfade{position:absolute;left:-40px;right:-40px;top:0;height:380px;background:radial-gradient(ellipse 960px 360px at 0 0,rgba(2,4,10,.94),rgba(2,4,10,.62) 52%,rgba(2,4,10,0) 84%),linear-gradient(180deg,rgba(2,4,10,.7),rgba(2,4,10,0) 90px)}
.botfade{position:absolute;left:-40px;right:-40px;bottom:0;height:290px;background:linear-gradient(0deg,rgba(2,4,10,.92),rgba(2,4,10,.66) 70%,rgba(2,4,10,0))}
.hd{position:absolute;left:24px;top:18px;width:max-content;text-shadow:0 0 6px var(--bg),0 0 14px var(--bg)}
.eb{width:max-content;font-size:10px;letter-spacing:.26em;color:var(--mute);white-space:nowrap}
.eb b{color:var(--ice);font-weight:500}
.hd h1{margin:12px 0 0;font-family:var(--display);font-weight:700;font-size:44px;line-height:1.06;letter-spacing:.05em;color:var(--ink)}
.hd h1 span{display:block;width:max-content;white-space:nowrap}
.hd h1 .l1{display:flex;align-items:center;width:max-content}
.hd h1 em{font-style:normal;font-family:var(--cjk);font-weight:900;font-size:36px;line-height:1;letter-spacing:.08em;margin-left:22px;position:relative;top:0;text-shadow:none;background:linear-gradient(90deg,#b8dcff,#ffb48f);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 10px rgba(150,190,255,.35))}
.sub{width:max-content;margin-top:12px;font-family:var(--cjk);font-size:14px;letter-spacing:.06em;color:var(--ink2);white-space:nowrap}
.sub2{width:max-content;margin-top:6px;font-size:10px;letter-spacing:.16em;color:var(--mute);white-space:nowrap}
.sub2 b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
/* 当前章节（参考视频左上那块：编号 + 章节名 + 一行说明） */
.sec{--c:#9fd4ff;position:absolute;left:24px;top:214px;width:max-content;padding-left:13px;border-left:3px solid var(--c);text-shadow:0 0 6px var(--bg),0 0 14px var(--bg);transition:border-color .4s}
.sec-t{width:max-content;font:500 10px/1 var(--mono);letter-spacing:.14em;color:var(--mute);white-space:nowrap}
.sec-t b{color:var(--ink2);font-weight:500;letter-spacing:.06em;font-family:var(--cjk)}
.sec-h{width:max-content;margin-top:8px;display:flex;align-items:baseline;gap:12px;white-space:nowrap}
.sec-h b{font:700 15px/1 var(--mono);color:var(--c);transition:color .4s}
.sec-h strong{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;letter-spacing:.06em;color:var(--ink)}
.sec-h i{font-style:normal;font-family:var(--cjk);font-size:15px;color:var(--ink2)}
.sec-s{width:max-content;margin-top:8px;font:400 12px/1.3 var(--cjk);color:var(--ink2);white-space:nowrap}
.sec-s em{font-style:normal;color:var(--pink)}
.sec-s u{text-decoration:none;color:var(--good)}
/* 右上：数据栏 + 流程标签（参考视频顶部两行） */
.top{position:absolute;left:1010px;right:268px;top:20px}
.strip{display:flex;gap:18px;align-items:baseline;font-size:10.5px;letter-spacing:.08em;color:var(--mute);white-space:nowrap;overflow:hidden}
.strip b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums;margin-left:6px;letter-spacing:.02em}
.strip b.pk{color:var(--pink)}
.tabs{display:flex;gap:4px;margin-top:10px}
.tabs i{--c:#9fd4ff;flex:1;min-width:0;font:500 10.5px/22px var(--mono);font-style:normal;text-align:center;color:var(--mute);border-bottom:1px solid var(--hair2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.06em;transition:background-color .3s,color .3s}
.tabs i.d{color:var(--ink2);border-bottom:2px solid var(--c)}
.tabs i.c{background:var(--c);color:#050811;font-weight:700;border-bottom-color:var(--c)}
.tools{position:absolute;right:24px;top:14px;display:flex;gap:6px}
button.tb{font:500 11px/1 var(--mono);letter-spacing:.1em;color:var(--ink2);background:rgba(6,10,22,.7);border:1px solid rgba(150,190,255,.3);padding:8px 11px;cursor:pointer;white-space:nowrap}
button.tb b{color:var(--ink);font-weight:700;font-family:var(--cjk);margin-left:6px;letter-spacing:.04em}
button.tb:hover{border-color:var(--ice);color:var(--ink)}
button.tb:focus-visible{outline:1px solid var(--ice);outline-offset:2px}

/* ---------- 底部六个玻璃框体 ---------- */
.dp{--c:#9fd4ff;position:absolute;bottom:30px;height:208px;box-sizing:border-box;display:flex;flex-direction:column;min-width:0;padding:8px 11px 9px;background:linear-gradient(180deg,rgba(12,19,40,.82),rgba(5,8,20,.9));border:1px solid rgba(140,185,255,.2);border-radius:3px;box-shadow:inset 0 1px 0 rgba(190,215,255,.07),0 12px 30px rgba(0,0,0,.45)}
.dp::before{content:"";position:absolute;left:-1px;top:-1px;width:28px;height:2px;background:var(--c);box-shadow:0 0 8px var(--c)}
.dp::after{content:"";position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border:solid rgba(170,205,255,.5);border-width:0 1px 1px 0}
.dp-h{display:flex;align-items:baseline;gap:8px;white-space:nowrap;padding-bottom:6px;margin-bottom:7px;border-bottom:1px solid var(--hair)}
.dp-h b{font:700 10.5px/1 var(--mono);letter-spacing:.16em;color:var(--ink)}
.dp-h i{font-style:normal;font-family:var(--cjk);font-size:10.5px;color:var(--ink2);letter-spacing:.06em}
.dp-h span{margin-left:auto;font-size:10px;color:var(--mute);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dp-h span.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--good);margin-right:6px;vertical-align:1px;box-shadow:0 0 6px var(--good)}
.p-log{left:24px;width:270px;--c:#9fd4ff}
.p-sec{left:306px;width:300px;--c:#a093ff}
.p-rad{left:618px;width:270px;--c:#62e3ff}
.p-heat{left:900px;width:330px;--c:#ff86c2}
.p-score{left:1242px;width:250px;--c:#ffd27a}
.p-code{left:1504px;width:392px;--c:#ffb48f}
.log{list-style:none;margin:0;padding:0;font:400 10px/15.5px var(--mono);overflow:hidden;flex:1;min-height:0}
.log li{display:grid;grid-template-columns:40px 36px minmax(0,1fr);gap:6px;white-space:nowrap}
.log .tm{color:var(--dim)}
.log .vb{font-weight:700}
.log .tx{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;font-family:var(--cjk)}
.log .walk{color:var(--ice)} .log .crawl{color:#7f8ca8} .log .read{color:#c9d6ee} .log .link{color:var(--cyan)} .log .flag{color:var(--pink)} .log .ask{color:var(--gold)} .log .fix{color:var(--good)} .log .ship{color:var(--peach)} .log .load{color:#fff}
.secs{display:grid;gap:5px;align-content:start;flex:1;min-height:0}
.secs div{--c:#fff;display:grid;grid-template-columns:56px minmax(0,1fr) 40px;gap:8px;align-items:center;font:400 10.5px/14px var(--mono);color:var(--ink2);white-space:nowrap}
.secs div span:first-child{color:var(--c)}
.secs div.c span:first-child{font-weight:700;text-shadow:0 0 8px var(--c)}
.secs div.w{opacity:.5}
.secs u{display:block;height:4px;background:rgba(200,215,240,.1);position:relative;overflow:hidden;text-decoration:none}
.secs u s{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--c);box-shadow:0 0 6px var(--c);text-decoration:none;transition:width .3s}
.secs em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.secs-f{margin-top:auto;font-size:9.5px;letter-spacing:.06em;color:var(--mute);white-space:nowrap}
.rad-c{display:block;width:248px;height:112px}
.rad-n{display:grid;gap:2px;margin-top:4px}
.rad-n div{display:grid;grid-template-columns:96px minmax(0,1fr) 24px;gap:8px;align-items:center;font:400 10px/14px var(--cjk);color:var(--ink2);white-space:nowrap}
.rad-n div span i{font-style:normal;font-family:var(--mono);font-size:9px;color:var(--mute);margin-left:5px}
.rad-n u{display:block;height:3px;background:rgba(200,215,240,.1);position:relative;text-decoration:none}
.rad-n u s{position:absolute;left:0;top:0;bottom:0;background:var(--cyan);text-decoration:none;transition:width .3s}
.rad-n b{text-align:right;font:500 10px/1 var(--mono);color:var(--ink)}
.heat-b{flex:1;display:grid;grid-template-columns:166px minmax(0,1fr);gap:12px;min-height:0}
.heat-c{display:block;width:166px;height:150px}
.heat-r{display:grid;align-content:start;gap:4px;min-width:0}
.heat-r span{font-size:9px;letter-spacing:.14em;color:var(--mute);white-space:nowrap}
.heat-r big{font:600 22px/1 var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.heat-r big small{font-size:10px;color:var(--mute);margin-left:3px}
.heat-r dl{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;margin:6px 0 0;font:400 10px/1.25 var(--mono)}
.heat-r dt{color:var(--ink2);font-family:var(--cjk)}
.heat-r dd{margin:0;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.heat-r dd.pk{color:var(--pink)} .heat-r dd.gd{color:var(--good)}
.sc-sp{display:block;width:226px;height:34px}
.sc-g{display:block;width:226px;height:100px;margin-top:2px}
.sc-f{margin-top:auto;display:flex;justify-content:space-between;font:400 10px/1.2 var(--cjk);color:var(--ink2);white-space:nowrap}
.sc-f b{color:var(--pink);font-family:var(--mono);font-weight:700}
.code{margin:0;padding:0;list-style:none;font:400 9.5px/12.6px var(--mono);color:#7f8ca8;overflow:hidden;flex:1;min-height:0;counter-reset:ln}
.code li{white-space:pre;overflow:hidden;text-overflow:ellipsis;padding-left:2px}
.code li::before{counter-increment:ln;content:counter(ln);display:inline-block;width:18px;margin-right:8px;text-align:right;color:var(--dim)}
.code li.hl{background:rgba(255,180,143,.1);color:var(--ink);box-shadow:inset 2px 0 0 var(--peach)}
.code .kw{color:#c6a6ff} .code .st{color:var(--gold)} .code .cm{color:var(--dim)} .code .fn{color:var(--cyan)}
.code li.cur::after{content:"▌";color:var(--peach);animation:blink 1s steps(1) infinite;margin-left:1px}
@keyframes blink{50%{opacity:0}}
.sb{position:absolute;left:24px;right:24px;bottom:8px;display:flex;align-items:center;justify-content:center;gap:28px;font-size:9.5px;letter-spacing:.14em;color:var(--mute);white-space:nowrap;overflow:hidden}
.sb b{color:var(--ink2);font-weight:500;font-variant-numeric:tabular-nums}
.sb .on::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--good);margin-right:7px;vertical-align:1px;box-shadow:0 0 6px var(--good)}
.sb .wm{font-family:var(--display);font-size:9px;letter-spacing:.3em;color:var(--dim)}

/* ---------- 悬停提示 ---------- */
.tip{position:absolute;z-index:5;pointer-events:none;min-width:200px;max-width:290px;background:rgba(5,8,18,.94);border:1px solid var(--hair2);border-left:2px solid var(--c,#fff);padding:8px 11px;font-size:11px;line-height:1.6;font-family:var(--cjk);color:var(--ink2)}
.tip b{font-family:var(--mono);font-weight:800;color:var(--c,#fff);margin-right:8px;letter-spacing:.04em}
.tip strong{color:var(--ink);font-weight:500}
.tip span{display:block}
.tip .h{color:var(--mute);font-size:10px;margin-top:3px}

/* ---------- 窄屏 / 竖屏 ---------- */
.mini{display:none;position:absolute;inset:0;flex-direction:column;justify-content:space-between;pointer-events:none;padding-block:10px}
.narrow .board{display:none}
.narrow .mini{display:flex}
.m-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.m-title{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.05em;line-height:1.1;text-shadow:0 0 8px var(--bg)}
.m-title i{display:block;font-style:normal;font-family:var(--cjk);font-weight:700;font-size:12px;color:var(--peach);letter-spacing:.12em;margin-top:5px}
.m-btns{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px;max-width:210px}
.m-btns .tb{padding:6px 8px;font-size:10px}
.m-bot{background:linear-gradient(0deg,rgba(2,4,10,.92),rgba(2,4,10,.6) 70%,transparent);margin-inline:-16px;padding:24px 16px 0}
.m-cap{font-family:var(--cjk);font-size:12px;color:var(--ink2);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px solid var(--hair2);padding-top:8px;margin-top:8px}
.m-stats div{display:grid;gap:2px;min-width:0}
.m-stats span{font-size:9px;letter-spacing:.12em;color:var(--mute);white-space:nowrap}
.m-stats b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-wm{margin-top:6px;font-family:var(--display);font-weight:400;font-size:8.5px;letter-spacing:.3em;color:var(--dim);text-align:center}
.glfail{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:340px;text-align:center;font-family:var(--cjk);font-size:13px;line-height:1.7;color:var(--ink2);border:1px solid var(--hair2);padding:14px 18px;background:rgba(5,8,18,.85)}
@media (prefers-reduced-motion:reduce){.cl,.wt{transition:none}.code li.cur::after{animation:none}}
</style>

<canvas class="gl" id="gl" aria-label="LHH用工合规助手大屏咨询星图。12 团星云对应 12 类用工问题。蜘蛛梳理相关要点，遇到疑问时补充说明，最后汇总并模拟回复用户。拖动旋转视角，滚轮缩放，点击星云可拉近查看。"></canvas>
<div class="vig" aria-hidden="true"></div>
<div class="ovl" id="lbls" aria-hidden="true"></div>
<div class="nr" id="nr">
<div class="fit"><div class="fit-in" id="fitIn">
 <div class="board" id="board">
  <div class="topfade"></div>

  // 词标签：当前章节 + 刚审完的章节（渐隐）
  const show = [];
  if (task) task.sections.forEach((sec, si) => sec.words.forEach(w => { if (w.state !== 'idle' && w.f > .02 && (si === crawl.sec || si === crawl.sec - 1 || crawl.phase === 'ship' || crawl.phase === 'rest' || crawl.phase === 'return')) show.push(w); }));
  if (crawl.phase !== 'read' && crawl.phase !== 'walk') { /* 回星核后只留模糊词的结果 */ for (let i = show.length - 1; i >= 0; i--) if (show[i].kind !== 'vague') show.splice(i, 1); }
  else { const cur = curSec(), recent = cur ? cur.words.slice(Math.max(0, crawl.wi - 6), crawl.wi) : []; for (let i = show.length - 1; i >= 0; i--) { const w = show[i]; if (w.kind !== 'vague' && w.state !== 'lnk' && !recent.includes(w)) show.splice(i, 1); } }
  const placed = [];
  show.slice(0, wtPool.length).forEach((w, i) => {
    const P = wtPool[i], p = wordPos(w), [x, y, z] = project(p.x, p.y, p.z);
    if (z > 1) return;
    const key = w.w + w.state;
    if (P.key !== key) {
      P.key = key;
      P.el.className = 'wt' + (w.state === 'flag' ? ' flag' : w.state === 'ask' ? ' ask' : w.state === 'fix' ? ' fix' : w.state === 'lnk' ? ' lnk' : '');
      P.el.innerHTML = w.state === 'flag' ? `${w.w} · 待澄清` : w.state === 'ask' ? `${w.w} · 澄清中` : w.state === 'fix' ? `<s>${w.w}</s>${w.fix}` : w.state === 'lnk' ? `${w.w} → ${AG[(task.sections[w.sec + 1] || task.sections[w.sec]).ai].k.toLowerCase()}` : w.w;
    }
    P.el.style.display = ''; P.el.style.setProperty('--f', (w.f * (w.sec === crawl.sec || crawl.phase !== 'read' ? 1 : .55)).toFixed(2));
    placed.push({P, x, y, w: P.el.offsetWidth * sc, h: 20 * sc});
  });
  for (let i = placed.length; i < wtPool.length; i++) if (wtPool[i].el.style.display !== 'none') { wtPool[i].el.style.display = 'none'; wtPool[i].key = ''; }
  placed.sort((a, b) => a.y - b.y); const done = [];
  const hr = host.getBoundingClientRect();
  for (let k = 0; k <= 12; k++) { const el = clEls[k]; if (el.style.display === 'none') continue; const r = el.getBoundingClientRect(); if (r.width < 2) continue; done.push({l: r.left - hr.left, r: r.right - hr.left, t: r.top - hr.top, b: r.bottom - hr.top}); }
  PRC.forEach(r => done.push({l: r[0], r: r[2], t: r[1], b: r[3]}));
  // 词标签也让开星云蛛本体，别把它盖住
  { const [sx, sy] = project(spider.x, spider.y + .5 * SS / S, spider.z), [ex] = project(spider.x + 1.6 * SS, spider.y + .5 * SS / S, spider.z), rr = Math.max(24, Math.abs(ex - sx)); done.push({l: sx - rr, r: sx + rr, t: sy - rr * .85, b: sy + rr * .7}); }
  const off = 8 * sc, minY = 8;
  placed.forEach(q => {
    let ty = q.y;
    const l = q.x - q.w / 2, r = q.x + q.w / 2;
    for (let it = 0; it < 6; it++) { const t = ty - q.h - off, b = ty - off; const hit = done.find(o => l < o.r + 3 && r > o.l - 3 && t < o.b + 2 && b > o.t - 2); if (!hit) break; const up = hit.t - 3 + off; ty = up - q.h - off < minY || hit.t < H * .14 ? hit.b + 3 + q.h + off : up; }
    q.ty = ty; done.push({l, r, t: ty - q.h - off, b: ty - off});
    const P = q.P; P.dy = P.dy == null ? ty - q.y : P.dy + (ty - q.y - P.dy) * .25;
    P.el.style.transform = `translate(${(q.x - q.w / 2).toFixed(1)}px,${(q.y + P.dy - q.h - 8 * sc).toFixed(1)}px) scale(${sc.toFixed(3)})`;
    P.el.style.transformOrigin = '0 0';
  });
}

/* ================= 7. 主循环 ================= */
let uiAcc = 0, panAcc = 0, lastNow = performance.now();
let fps = 60, fpsN = 0, fpsT = 0, lowT = 0;
function frame(now){
  requestAnimationFrame(frame);
  if (host.hidden || document.hidden) { lastNow = now; return; }
  const real = (now - lastNow) / 1000, dt = Math.min(.1, real); lastNow = now;
  simStep(dt); animT += dt; frameN++; coreSay.t -= dt;
  if (codeChars < 2000) codeChars += dt * 90;
  uiAcc += dt;
  if (uiAcc >= .2) { uiAcc = 0; renderLog(); renderTabs(); renderSec(); renderStrip(); renderSecs(); renderCounters(); renderCode(); }
  if ((panAcc += dt) >= .12 && !narrow) { panAcc = 0; drawPanels(); }
  if (!glOK) return;
  camStep(dt);
  updateScene(dt);
  placeOverlays();
  if (composer) composer.render(); else renderer.render(scene, camera);
  fpsN++; fpsT += Math.min(real, 2);
  if (fpsT >= 1) {
    fps = Math.round(fpsN / fpsT); fpsN = 0; fpsT = 0;
    if (fps < 30) lowT++; else lowT = 0;
    if (lowT >= 3) { lowT = 0; if (pr > 1) { pr = 1; layout(); } else if (pr > .75) { pr = .75; layout(); } else if (composer) { composer = null; } }
  }
  if (hover >= 0 && !tip.hidden) showTip(hover);
}
function camStep(dt){
  if (cam.userT > 0) cam.userT -= dt; else { cam.yaw *= Math.exp(-dt * .6); cam.pitch *= Math.exp(-dt * .6); }
  camWant(animT);
  const kk = 1 - Math.exp(-dt * (MODES[modeI].id === 'follow' && cam.focus < 0 ? (spider.air ? 4.2 : 2.6) : 1.6));
  cam.pos.lerp(cam.want, kk); cam.tgt.lerp(cam.wantT, kk);
  camera.position.copy(cam.pos); camera.lookAt(cam.tgt);
}

/* ---------- 尺寸 ---------- */
function layout(){
  if (host.hidden || host.clientWidth < 2) return;
  const r = host.getBoundingClientRect();
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  narrow = W < 760 || W / H < 1.05;
  nr.classList.toggle('narrow', narrow); lblLayer.style.display = narrow ? 'none' : '';
  const fr = fitIn.getBoundingClientRect();
  bs = Math.min(fr.width / 1920, fr.height / 1080) || .2;
  BW = fr.width / bs; BH = fr.height / bs;
  board.style.width = BW + 'px'; board.style.height = BH + 'px';
  board.style.setProperty('--s', bs);
  if (!glOK) return;
  baseAz = narrow && W / H < 1 ? HP : 0;
  renderer.setPixelRatio(pr); renderer.setSize(W, H, false);
  if (composer) { composer.setPixelRatio(pr); composer.setSize(W, H); }
  camera.aspect = W / H;
  fitCamera();
  camera.position.copy(cam.pos); camera.lookAt(cam.tgt); camera.updateMatrixWorld();
  const t = Math.tan(camera.fov * Math.PI / 360);
  U.px.value = H * pr / (2 * t);
  streakG.scale.set(100 * t * camera.aspect, 100 * t, 1);
}

/* ---------- 交互 ---------- */
let hover = -1, drag = null;
function screenOf(k){ const c = CL[k]; const [x, y] = project(c.x, c.cy, c.z); return [x, y]; }
function pickAt(x, y){
  if (!glOK) return -1;
  let best = -1, bd = Infinity;
  for (let k = 0; k <= 12; k++) { const [sx, sy] = screenOf(k), r = k === 0 ? 100 : 90; const d = (sx - x) ** 2 + (sy - y) ** 2; if (d < r * r && d < bd) { bd = d; best = k; } }
  const [qx, qy] = project(spider.x, spider.y + .5, spider.z); if ((qx - x) ** 2 + (qy - y) ** 2 < 40 * 40) best = CRAWLER;
  return best;
}
function showTip(k){
  const a = AG[k]; let now;
  if (k === 0) now = task ? `${task.id} ${task.name} · 评分 ${Math.round(task.shown)} · 待澄清 ${openFlags()} 项` : '—';
  else if (k === CRAWLER) { const s = curSec(); now = spider.air ? `跳向 ${s ? AG[s.ai].zh : '咨询助手'}` : crawl.phase === 'read' && s ? `在读 ${AG[s.ai].k} · ${s.read}/${s.words.length}` : '待命'; }
  else { const idx = task ? task.path.indexOf(k) : -1, sec = idx >= 0 ? task.sections[idx] : null; now = sec ? (sec.done ? '本次咨询已梳理' : curSec() === sec ? `正在梳理 · ${sec.read}/${sec.words.length}` : '本次咨询待梳理') : `模拟活跃度 ${Math.round(load[k] * 100)}%`; }
  tip.style.setProperty('--c', a.col);
  tip.innerHTML = `<span><b>${a.k}</b><strong>${a.zh}</strong></span><span>${a.role}</span><span>当前：${now}</span>` + (k > 0 && k < 13 ? `<span class="h">${cam.focus === k ? '再点一次返回全景' : '点击拉近看这团星云'}</span>` : '');
  tip.hidden = false;
  const [sx, sy] = k === CRAWLER ? project(spider.x, spider.y + .5, spider.z) : screenOf(k), tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = sx + 24, y = sy - th / 2; if (x + tw > W - 12) x = sx - tw - 24;
  tip.style.left = clamp(x, 8, W - tw - 8) + 'px'; tip.style.top = clamp(y, 8, H - th - 8) + 'px';
}
function setFocus(k){ cam.focus = (k <= 0 || k === CRAWLER || cam.focus === k) ? -1 : k; cam.zoom = 1; cam.yaw = cam.pitch = 0; syncButtons(); }
cv.addEventListener('pointerdown', e => { drag = {x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, moved: false}; try { cv.setPointerCapture(e.pointerId); } catch (_) {} });
cv.addEventListener('pointermove', e => {
  const r = host.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
    if (Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) > 5) { drag.moved = true; cv.classList.add('drag'); }
    if (drag.moved && glOK) { cam.yaw -= dx * .005; cam.pitch += dy * .004; cam.userT = 6; tip.hidden = true; hover = -1; }
    return;
  }
  const k = pickAt(x, y); hover = k; cv.classList.toggle('hov', k >= 0);
  if (k >= 0) showTip(k); else tip.hidden = true;
});
cv.addEventListener('pointerup', e => {
  const wasDrag = drag && drag.moved; drag = null; cv.classList.remove('drag');
  if (wasDrag || !glOK) return;
  const r = host.getBoundingClientRect(), k = pickAt(e.clientX - r.left, e.clientY - r.top);
  if (k > 0 && k < 13) setFocus(k); else if (cam.focus >= 0) setFocus(cam.focus);
});
cv.addEventListener('pointerleave', () => { if (!drag) { tip.hidden = true; hover = -1; } });
cv.addEventListener('wheel', e => { if (!glOK) return; e.preventDefault(); cam.zoom = clamp(cam.zoom * Math.exp(e.deltaY * .0012), .3, 1.6); }, {passive: false});
function syncButtons(){ $$('[data-f="mode"]').forEach(b => b.textContent = cam.focus >= 0 ? '返回' : MODES[modeI].zh); }
function act(name){
  if (name === 'mode') { if (cam.focus >= 0) cam.focus = -1; else modeI = (modeI + 1) % MODES.length; cam.yaw = cam.pitch = 0; cam.zoom = 1; }
  else if (name === 'full') {
    try {
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
      else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => { const b = $('[data-f="full"]'); b.textContent = '不支持'; setTimeout(() => b.textContent = '全屏', 1500); });
    } catch (e) { /* 部分窗口不允许全屏 */ }
  }
  syncButtons();
}
$$('[data-act]').forEach(b => b.addEventListener('click', () => act(b.dataset.act)));
document.addEventListener('fullscreenchange', () => { const b = $('[data-f="full"]'); if (b) b.textContent = document.fullscreenElement ? '退出全屏' : '全屏'; });
document.addEventListener('keydown', e => {
  if (host.hidden) return;
  const tag = (e.target && e.target.tagName) || '';
  if (/INPUT|TEXTAREA|SELECT/.test(tag) || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'v' || e.key === 'V') act('mode');
  if (e.key === 'Escape' && cam.focus >= 0) setFocus(cam.focus);
});

/* ---------- 开场 ---------- */
newTask();
new ResizeObserver(() => layout()).observe(host);
layout();
if (glOK) {
  camWant(0);
  cam.pos.copy(cam.want); cam.tgt.copy(cam.wantT);
  camStep(0);
}
renderLog(); renderTabs(); renderSec(); renderStrip(); renderSecs(); renderCounters(); renderCode(); drawPanels();
clockTick(); setInterval(clockTick, 1000);
syncButtons();
// 调试用：快进模拟若干秒（控制台里 document.getElementById('host-nebula').__ff(20)）
host.__ff = sec => { ffing = true; for (let t = 0; t < sec; t += .05) { simStep(.05); animT += .05; frameN++; coreSay.t -= .05; codeChars += 4.5; if (glOK) { camStep(.05); updateScene(.05); } } ffing = false; };
host.__st = () => ({phase: crawl.phase, sec: crawl.sec, wi: crawl.wi, score: task && Math.round(task.shown), reads: task && task.reads, flags: task && task.flags, fixes: task && task.fixes, open: openFlags(), comets: comets.length, x: spider.x.toFixed(1), z: spider.z.toFixed(1)});
host.__mode = i => { modeI = i; syncButtons(); };
host.__focus = k => setFocus(k);
host.__ui = () => { logDirty = true; renderLog(); renderTabs(); renderSec(); renderStrip(); renderSecs(); renderCounters(); renderCode(); drawPanels(); placeOverlays(); };
host.__info = () => glOK ? (renderer.info.autoReset = false, renderer.info.reset(), renderer.render(scene, camera), renderer.info.autoReset = true, {calls: renderer.info.render.calls, tris: renderer.info.render.triangles, pts: renderer.info.render.points}) : null;
requestAnimationFrame(frame);
}

const host = document.getElementById('host-nebula');
const root = host.attachShadow({mode: 'open'});
root.appendChild(document.getElementById('tpl-nebula').content.cloneNode(true));
mountNebula(host, root);
</script>
